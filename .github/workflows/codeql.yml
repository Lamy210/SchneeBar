name: CodeQL

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && github.event.action != 'closed')
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.9.5"
          github_token: ""
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      # Generate before CodeQL enables its DYLD tracer. Tuist itself loads
      # ProjectDescription dynamically and should not run under that tracer.
      - name: Generate Xcode project
        run: tuist generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: |
          xcodebuild \
            -workspace SchneeBar.xcworkspace \
            -scheme SchneeBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
