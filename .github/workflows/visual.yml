name: Visual Regression

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout PR base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _baseline
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          github_token: ""
          cache_save: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Render candidate
        run: |
          mkdir -p _visual/candidate
          tuist run SchneeBarVisualSnapshotCLI -- --output "$GITHUB_WORKSPACE/_visual/candidate"

      - name: Render PR base
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_visual/baseline"
          if [[ -f "$GITHUB_WORKSPACE/_baseline/Project.swift" ]]; then
            cd "$GITHUB_WORKSPACE/_baseline"
            mise exec -- tuist run SchneeBarVisualSnapshotCLI -- --output "$GITHUB_WORKSPACE/_visual/baseline"
          else
            echo "PR base does not contain the visual renderer yet; candidate images will be reported as NEW."
          fi

      - name: Build visual report
        run: |
          python3 Scripts/visual_report.py \
            --baseline _visual/baseline \
            --candidate _visual/candidate \
            --output _visual/report
          cat _visual/report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-report
          path: _visual/report
          retention-days: 14
