name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.9.5"
          github_token: ""
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Generate project
        run: tuist generate

      - name: Build
        run: tuist build -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Prepare isolated external widget smoke fixture
        if: runner.environment == 'github-hosted'
        run: bash Scripts/external_widget_smoke_fixture.sh setup

      - name: Test
        run: tuist test -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Clean isolated external widget smoke fixture
        if: always() && runner.environment == 'github-hosted'
        run: bash Scripts/external_widget_smoke_fixture.sh cleanup
