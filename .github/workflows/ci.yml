name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.9.5"
          github_token: ""
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Generate project
        run: tuist generate

      - name: Build
        run: tuist build -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Prepare isolated external widget smoke fixture
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail

          owner="$HOME/Library/Application Support/SchneeBar"
          root="$owner/ExternalWidgets"
          fixture="$root/schneebar-ci-smoke.json"
          sentinel="$root/.schneebar-ci-smoke-ready"
          owner_state="$RUNNER_TEMP/schneebar-ci-created-owner"
          root_state="$RUNNER_TEMP/schneebar-ci-created-root"

          rm -f -- "$owner_state" "$root_state"

          if [[ -L "$owner" || -L "$root" ]]; then
            echo "Refusing symlinked SchneeBar Application Support storage." >&2
            exit 1
          fi

          if [[ -e "$root" ]]; then
            [[ -d "$root" ]] || {
              echo "ExternalWidgets exists but is not a directory." >&2
              exit 1
            }
            if [[ -n "$(find "$root" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
              echo "Refusing to overwrite non-empty ExternalWidgets storage." >&2
              exit 1
            fi
          else
            if [[ ! -e "$owner" ]]; then
              mkdir -p -- "$owner"
              : > "$owner_state"
            elif [[ ! -d "$owner" ]]; then
              echo "SchneeBar Application Support owner is not a directory." >&2
              exit 1
            fi

            mkdir -- "$root"
            : > "$root_state"
          fi

          umask 077
          cat > "$fixture" <<'JSON'
          {
            "schemaVersion": 1,
            "id": "external.ci.smoke",
            "displayName": "CI External Widget",
            "defaultEnabled": false,
            "defaultOrder": 1200,
            "defaultRepresentation": "normal",
            "visibility": {
              "kind": "always"
            },
            "refresh": {
              "kind": "manual"
            },
            "snapshot": {
              "severity": "nominal",
              "priority": "normal",
              "compact": {
                "text": "CI",
                "systemImage": "checkmark.circle",
                "accessibilityLabel": "CI external widget"
              },
              "normal": {
                "text": "CI smoke",
                "systemImage": "checkmark.circle",
                "accessibilityLabel": "CI external widget smoke"
              }
            }
          }
          JSON
          : > "$sentinel"

      - name: Test
        run: tuist test -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Clean isolated external widget smoke fixture
        if: always() && runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail

          owner="$HOME/Library/Application Support/SchneeBar"
          root="$owner/ExternalWidgets"
          fixture="$root/schneebar-ci-smoke.json"
          sentinel="$root/.schneebar-ci-smoke-ready"
          owner_state="$RUNNER_TEMP/schneebar-ci-created-owner"
          root_state="$RUNNER_TEMP/schneebar-ci-created-root"

          rm -f -- "$fixture" "$sentinel"

          if [[ -f "$root_state" ]]; then
            rmdir -- "$root" 2>/dev/null || true
          fi
          if [[ -f "$owner_state" ]]; then
            rmdir -- "$owner" 2>/dev/null || true
          fi

          rm -f -- "$owner_state" "$root_state"
