name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Generate project
        run: tuist generate

      - name: Build
        run: tuist build -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: tuist test -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO
