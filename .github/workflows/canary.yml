name: Toolchain Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "41 17 * * 4"

permissions:
  contents: read

jobs:
  xcode-27-preview:
    # Preview runner/toolchain: signal only, never a release or merge gate.
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.9.5"
          github_token: ""
          cache_save: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          tuist version

      - name: Generate project
        run: tuist generate

      - name: Build preview compatibility
        run: tuist build -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Test preview compatibility
        run: tuist test -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO
