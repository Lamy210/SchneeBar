name: Toolchain Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "41 17 * * 4"

permissions:
  contents: read

jobs:
  xcode-27-preview:
    # Preview runner/toolchain: signal only, never a release or merge gate.
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.9.5"
          github_token: ""
          cache_save: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          tuist version

      - name: Generate project
        run: tuist generate

      - name: Build preview compatibility
        run: tuist build -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO

      - name: Test preview compatibility
        run: tuist test -- -skipMacroValidation CODE_SIGNING_ALLOWED=NO
